name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft:
        description: "Draft a GitHub Release"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: auto

jobs:
  backend:
    name: Elixir backend (Burrito) ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: macos, triple: aarch64-apple-darwin }
          - { os: ubuntu-22.04, target: linux, triple: x86_64-unknown-linux-gnu }
          - { os: macos-14, target: windows, triple: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Elixir/Erlang/Zig/XZ via mise
        uses: jdx/mise-action@v4.2.5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install: true
          tools: |
            elixir@1.20.3-otp-29
            erlang@29.0.5
            zig@0.16.0
            xz

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Configure Burrito target
        run: echo "BURRITO_TARGET=${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: Install Hex + deps + deps unlock
        run: |
          mix local.hex --force
          mix deps.get
          mix deps.unlock --unused

      - name: Compile + test + assets
        run: |
          mix compile --warnings-as-errors
          mix test
          mix assets.deploy

      - name: Build Burrito release
        run: mix release --overwrite
        env:
          MIX_ENV: prod

      - name: Locate artifact
        id: artifact
        run: |
          case "${{ matrix.target }}" in
            macos)   a=burrito_out/catenary_macos ;;
            linux)   a=burrito_out/catenary_linux ;;
            windows) a=burrito_out/catenary_windows.exe ;;
          esac
          echo "artifact=$a" >> "$GITHUB_OUTPUT"
          echo "name=catenary-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.target }}
          path: ${{ steps.artifact.outputs.artifact }}

  shell-linux:
    name: Native shell (Tauri) Linux x86_64
    needs: backend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - uses: actions/download-artifact@v4
        with:
          name: backend-linux
          path: src-tauri/binaries

      - name: Rename sidecar to the compile-time name Tauri expects
        run: |
          mv src-tauri/binaries/catenary_linux \
             src-tauri/binaries/catenary-backend-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/catenary-backend-x86_64-unknown-linux-gnu

      - name: Build deb + AppImage
        run: tauri build --bundles deb appimage

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  shell-windows:
    name: Native shell (Tauri) Windows x86_64
    needs: backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - uses: actions/download-artifact@v4
        with:
          name: backend-windows
          path: src-tauri/binaries

      - name: Rename sidecar to the compile-time name Tauri expects
        shell: bash
        run: |
          mv src-tauri/binaries/catenary_windows.exe \
             src-tauri/binaries/catenary-backend-x86_64-pc-windows-msvc.exe

      - name: Build NSIS installer
        run: tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  shell:
    name: Native shell (Tauri)
    needs: [backend, shell-linux, shell-windows]
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Set up build tools via mise
        uses: jdx/mise-action@v4.2.5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install: true
          tools: |
            zig@0.16.0
            xz

      - uses: actions/download-artifact@v4
        with:
          name: backend-macos
          path: src-tauri/binaries

      - name: Rename sidecar to the compile-time name Tauri expects
        run: |
          mv src-tauri/binaries/catenary_macos \
             src-tauri/binaries/catenary-backend-aarch64-apple-darwin
          chmod +x src-tauri/binaries/catenary-backend-aarch64-apple-darwin

      - name: Build signed .app (when signing secrets are configured)
        if: env.APPLE_CERTIFICATE != ''
        run: tauri build --bundles app

      - name: Build unsigned .app
        if: env.APPLE_CERTIFICATE == ''
        run: tauri build --bundles app --no-sign

      - name: Zip Catenary.app for distribution
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent Catenary.app "$GITHUB_WORKSPACE/Catenary-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: Catenary-macos.zip

  publish:
    name: Publish GitHub Release
    needs: [backend, shell-linux, shell-windows, shell]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.draft == true)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Downloads every artifact of this run into release/<artifact-name>/
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Normalize asset names and write release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd release
          mv "$(find desktop-linux -type f -name '*.deb')"      "Catenary-${version}-linux-x86_64.deb"
          mv "$(find desktop-linux -type f -name '*.AppImage')" "Catenary-${version}-linux-x86_64.AppImage"
          mv "$(find desktop-windows -type f -name '*.exe')"    "Catenary-${version}-windows-x86_64-setup.exe"
          mv "$(find desktop-macos -type f -name '*.zip')"      "Catenary-${version}-macos-aarch64.zip"
          cat > notes.md <<NOTES
          Catenary ${version} for all supported platforms.

          ### Linux (x86_64)
          - \`Catenary-${version}-linux-x86_64.deb\` — Pop!_OS / Ubuntu / Debian:
            \`sudo apt install ./Catenary-${version}-linux-x86_64.deb\`
          - \`Catenary-${version}-linux-x86_64.AppImage\` — any distro; needs webkit2gtk first:
            \`sudo apt install libwebkit2gtk-4.1-0\`, then \`chmod +x\` the file and run it.

          ### Windows (x86_64)
          - \`Catenary-${version}-windows-x86_64-setup.exe\` — standard installer with
            Start-menu shortcuts and an uninstaller.

          ### macOS (Apple Silicon)
          - \`Catenary-${version}-macos-aarch64.zip\` — unzip and drag to Applications.
            The build is unsigned: on first launch, right-click the app and choose Open.
          NOTES

      - name: Attach installers to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.sha) || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          body_path: release/notes.md
          files: |
            release/Catenary-*-linux-x86_64.deb
            release/Catenary-*-linux-x86_64.AppImage
            release/Catenary-*-windows-x86_64-setup.exe
            release/Catenary-*-macos-aarch64.zip
